
version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongo_container
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: vueapp
    volumes:
      - mongo_data:/data/db

  nginx:
    build: ./backend 
    container_name: web_server
    restart: always
    ports:
      - 80:80

  frontend:
    build: ./frontend
    

volumes:
  mongo_data:
    driver: local